# Load balancer configuration

balancer:
  port: 8080
  algorithm: weighted_round_robin   # round_robin | weighted_round_robin
  metrics_interval_ms: 5000         # how often metrics are polled
  metrics_timeout_ms: 8000          # /metrics can take several seconds on Windows
  health_interval_ms: 2000          # how often /health is checked
  health_timeout_ms: 1000
  failures_to_down: 3               # consecutive failures before marking DOWN
  request_timeout_ms: 15000         # max time for a forwarded request
  max_retries: 1                    # retries on another server if one fails

# Weight of each criterion in the score (must add up to 1)
weights:
  cpu_speed: 0.20
  ram_total: 0.10
  ram_free: 0.20
  processors: 0.05
  cores: 0.15
  active_processes: 0.10
  efficiency: 0.20

# Registered servers.
# "simulate" is optional: it overrides the static metrics to simulate
# different machines on the same PC. Remove it on real machines.
servers:
  - id: srv-1
    url: http://localhost:3001
    simulate:
      cpu_speed: 3.5
      ram_total: 16384
      processors: 1
      cores: 8

  - id: srv-2
    url: http://localhost:3002
    simulate:
      cpu_speed: 2.4
      ram_total: 8192
      processors: 1
      cores: 4

  - id: srv-3
    url: http://localhost:3003
    simulate:
      cpu_speed: 1.8
      ram_total: 4096
      processors: 1
      cores: 2
